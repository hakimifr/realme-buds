[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realme-buds"
version = "0.1.0"
description = "Control realme Buds Air7 Pro from a Linux computer over Bluetooth, no phone app needed"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
realme-buds = "realmebuds.cli:main"
realme-buds-gui = "realmebuds.gui:main"

[tool.setuptools]
packages = ["realmebuds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
