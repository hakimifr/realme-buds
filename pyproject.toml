[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realme-buds"
version = "0.1.0"
description = "Control OPPO/OnePlus/realme-family earbuds (built in: realme Buds Air7 Pro) from a Linux computer over Bluetooth, no phone app needed"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
realme-buds = "realmebuds.cli:main"
realme-buds-gui = "realmebuds.launch:main"

[tool.setuptools]
packages = ["realmebuds", "realmebuds.profiles"]

[tool.setuptools.package-data]
"realmebuds.profiles" = ["builtin/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
